---
- name: Checkout ai.robots.txt repository
  ansible.builtin.git:
    repo: https://github.com/ai-robots-txt/ai.robots.txt.git
    dest: "{{ deb_robots_homedir }}"
    single_branch: true
    force: true
    version: "{{ deb_robots_version }}"

- name: nginx file snippet
  ansible.builtin.copy:
    remote_src: true
    src: "{{ deb_robots_homedir }}/nginx-block-ai-bots.conf"
    dest: /etc/nginx/snippets/block-ai-bots.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload_nginx

- name: nginx templates snippets
  ansible.builtin.template:
    src: "{{ item }}_snip.j2"
    dest: "/etc/nginx/snippets/{{ item }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop:
    - block-ai-robots
  notify:
    - reload_nginx

- name: robots.txt
  ansible.builtin.copy:
    remote_src: true
    src: "{{ deb_robots_homedir }}/robots.txt"
    dest: "{{ deb_repository_basedir }}/robots.txt"
    owner: root
    group: root
    mode: "0644"
